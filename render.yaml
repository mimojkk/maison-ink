services:
  - type: web
    name: maison-ink
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: maison-ink-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: MAISON_DATA_FILE
        value: /var/data/maison.json
      - key: MAISON_ADMIN_PASSWORD
        sync: false
